<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang chủ — THÁI MỸ HƯƠNG</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, "Segoe UI", sans-serif; background: #f1f5f9; color: #1f2937; }

    /* Thanh trên */
    .topbar {
      background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.06);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand svg { width: 40px; height: 40px; }
    .brand b { color: #15803d; font-size: 18px; letter-spacing: .5px; }
    .user { display: flex; align-items: center; gap: 12px; }
    .user .info { text-align: right; line-height: 1.3; }
    .user .ten { font-weight: bold; font-size: 14px; }
    .badge { font-size: 11px; color: #fff; background: #16a34a; padding: 2px 10px; border-radius: 999px; }
    .badge.admin { background: #7c3aed; } .badge.quanly { background: #0ea5e9; } .badge.nhanvien { background: #16a34a; }
    .btn-out {
      background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 8px;
      font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .btn-out:hover { background: #dc2626; }

    /* Nội dung */
    .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }
    .wrap h2 { color: #334155; font-size: 20px; margin-bottom: 4px; }
    .wrap .hd { color: #64748b; font-size: 13px; margin-bottom: 20px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .tile {
      background: #fff; border-radius: 14px; padding: 20px 18px; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.06); transition: .15s; border-left: 5px solid #16a34a;
      display: flex; flex-direction: column; gap: 8px;
    }
    .tile:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.10); }
    .tile .ic { font-size: 30px; }
    .tile .tn { font-weight: bold; font-size: 15px; color: #1f2937; }
    .tile .st { font-size: 12px; color: #94a3b8; }

    #dangTai { text-align: center; padding: 60px; color: #94a3b8; }
  </style>
</head>
<body>
  <div id="dangTai">⏳ Đang tải…</div>

  <div id="appMain" style="display:none">
    <div class="topbar">
      <div class="brand">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="94" fill="none" stroke="#8bc34a" stroke-width="8"/>
          <g transform="translate(100,92)">
            <path d="M0,-6 C-8,-40 -46,-40 -46,-14 C-46,2 -22,6 0,-6 Z" fill="#22c55e"/>
            <path d="M0,-6 C8,-40 46,-40 46,-14 C46,2 22,6 0,-6 Z" fill="#16a34a"/>
            <path d="M-6,0 C-40,-8 -40,-46 -14,-46 C2,-46 6,-22 -6,0 Z" fill="#4ade80"/>
            <path d="M6,0 C40,-8 40,-46 14,-46 C-2,-46 -6,-22 6,0 Z" fill="#15803d"/>
          </g>
          <path d="M100,96 C96,120 90,140 78,158" fill="none" stroke="#0e7490" stroke-width="9" stroke-linecap="round"/>
        </svg>
        <b>THÁI MỸ HƯƠNG</b>
      </div>
      <div class="user">
        <div class="info">
          <div class="ten" id="tenNguoiDung">—</div>
          <span class="badge" id="vaiTroBadge">—</span>
        </div>
        <button class="btn-out" onclick="dangXuat()">Đăng xuất</button>
      </div>
    </div>

    <div class="wrap">
      <h2>Bảng điều khiển</h2>
      <div class="hd">Chọn chức năng để bắt đầu. Các ô hiện ra tùy theo quyền của bạn.</div>
      <div class="grid" id="luoiChucNang"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Danh sách chức năng. trang=null nghĩa là CHƯA dựng (bấm vào báo "đang xây dựng").
    var CHUC_NANG = [
      { ic:"📥", tn:"1. Tải dữ liệu KiotViet",        trang:null, quyen:["admin","quanly","nhanvien"], mau:"#3b82f6" },
      { ic:"📊", tn:"2. Tạo phiếu thu tiền & xuất kho", trang:null, quyen:["admin","quanly","nhanvien"], mau:"#8b5cf6" },
      { ic:"🗄️", tn:"3. Lưu trữ",                      trang:null, quyen:["admin","quanly","nhanvien"], mau:"#0ea5e9" },
      { ic:"📋", tn:"4. Kiểm đơn giao về",             trang:null, quyen:["admin","quanly","nhanvien"], mau:"#f59e0b" },
      { ic:"💾", tn:"5. Lưu kết quả kiểm đơn",         trang:null, quyen:["admin","quanly","nhanvien"], mau:"#10b981" },
      { ic:"📗", tn:"6. Bảng kê nộp tiền",             trang:null, quyen:["admin","quanly","nhanvien"], mau:"#14b8a6" },
      { ic:"📤", tn:"7. Xuất file bán hàng MISA",      trang:null, quyen:["admin","quanly","nhanvien"], mau:"#22c55e" },
      { ic:"💰", tn:"Theo dõi công nợ",                trang:null, quyen:["admin","quanly"],            mau:"#ef4444" },
      { ic:"📚", tn:"Danh mục dữ liệu",                trang:null, quyen:["admin","quanly"],            mau:"#64748b" },
      { ic:"👤", tn:"Quản lý tài khoản", trang:"quan_ly_taikhoan.html", quyen:["admin"], mau:"#7c3aed" }
    ];

    function moChucNang(cn) {
      if (cn.trang) window.location.href = cn.trang;
      else alert("🚧 Chức năng \"" + cn.tn + "\" đang được xây dựng.\nSẽ có ở bước kế tiếp.");
    }

    (async function () {
      var nd = await baoVeTrang();     // kiểm tra đăng nhập + lấy hồ sơ
      if (!nd) return;                 // chưa đăng nhập → đã tự chuyển về index.html

      // Hiện thông tin người dùng
      document.getElementById("tenNguoiDung").textContent = nd.ho_ten || "(chưa đặt tên)";
      var badge = document.getElementById("vaiTroBadge");
      badge.textContent = TEN_VAI_TRO[nd.vai_tro] || nd.vai_tro;
      badge.className = "badge " + nd.vai_tro;

      // Vẽ các ô chức năng theo quyền
      var luoi = document.getElementById("luoiChucNang");
      CHUC_NANG.filter(function (c) { return c.quyen.indexOf(nd.vai_tro) !== -1; })
               .forEach(function (c) {
        var div = document.createElement("div");
        div.className = "tile";
        div.style.borderLeftColor = c.mau;
        div.innerHTML = '<div class="ic">' + c.ic + '</div>' +
                        '<div class="tn">' + c.tn + '</div>' +
                        '<div class="st">' + (c.trang ? "Sẵn sàng" : "🚧 Đang xây dựng") + '</div>';
        div.addEventListener("click", function () { moChucNang(c); });
        luoi.appendChild(div);
      });

      document.getElementById("dangTai").style.display = "none";
      document.getElementById("appMain").style.display = "block";
    })();
  </script>
</body>
</html>
