<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Mục Dữ Liệu — THÁI MỸ HƯƠNG</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="layout.css">
  <style>
    .controls-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    #formThemMoi {
      background: #f8fafc;
      padding: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      border-radius: var(--radius-md);
      display: none;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 700; font-size: 12px; color: var(--text-main); }
    .form-group input { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; }
    .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <main id="mainContent" style="display:none;">
    
    <!-- Page Header -->
    <div class="tmh-page-header">
      <div>
        <h1 class="tmh-page-header-title"><span>📚</span> Quản Lý Danh Mục Dữ Liệu</h1>
        <p class="tmh-page-header-sub">Quản lý Khách hàng, Hàng hóa (Quy cách), Định khoản kế toán MISA, Danh sách xe vận chuyển và Bảng đổi mã khuyến mãi.</p>
      </div>
      <div style="display: flex; gap: 8px;">
        <button type="button" class="btn btn-primary" onclick="moFormThem()">
          <span>➕</span> Thêm Mới
        </button>
        <button type="button" class="btn btn-amber" onclick="taiTemplate()">
          <span>📄</span> Tải File Mẫu
        </button>
        <input type="file" id="fileExcel" accept=".xlsx, .xls, .csv" style="display: none;" onchange="docFileExcel(event)">
        <button type="button" class="btn btn-blue" onclick="document.getElementById('fileExcel').click()">
          <span>📥</span> Upload từ Excel
        </button>
      </div>
    </div>

    <!-- Khung Điều Khiển -->
    <div class="tmh-card">
      <div class="controls-bar">
        <label style="font-weight: 700; font-size: 13px;">Chọn bảng danh mục:</label>
        <select id="chonBang" class="form-control" onchange="doiBang()" style="padding: 7px 12px; font-weight: 700; font-size: 13px;">
          <option value="khach_hang">Khách hàng (khach_hang)</option>
          <option value="hang_hoa">Hàng hóa & Quy cách (hang_hoa)</option>
          <option value="dinh_khoan_hang_hoa">Định khoản hàng hóa MISA (dinh_khoan_hang_hoa)</option>
          <option value="tai_khoan_ngan_hang">Tài khoản ngân hàng (tai_khoan_ngan_hang)</option>
          <option value="danh_sach_xe">Danh sách xe (danh_sach_xe)</option>
          <option value="doi_ma_km">Đổi mã khuyến mãi (doi_ma_km)</option>
        </select>
      </div>

      <!-- Form nhập thủ công (Ẩn mặc định) -->
      <div id="formThemMoi"></div>

      <!-- Bảng Dữ Liệu -->
      <div class="tmh-table-wrap">
        <table class="tmh-table">
          <thead id="bangHead"></thead>
          <tbody id="bangBody">
            <tr><td colspan="10" class="text-center" style="padding: 20px;">Đang tải dữ liệu…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Phân trang -->
      <div class="pagination">
        <div>
          Hiển thị: 
          <select id="soDongHienThi" onchange="doiKichThuocTrang()" style="padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color);">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="500">500</option>
          </select> dòng / trang
        </div>
        <div>
          <button type="button" class="btn btn-outline btn-sm" onclick="chuyenTrang(-1)">⬅ Trước</button>
          <span id="thongTinTrang" style="margin: 0 12px; font-weight: 700;">Trang 1 / 1</span>
          <button type="button" class="btn btn-outline btn-sm" onclick="chuyenTrang(1)">Sau ➡</button>
        </div>
      </div>

    </div>

  </main>

  <script src="layout.js"></script>
  <script>
    let trangHienTai = 1;
    let tongSoTrang = 1;
    let duLieuBangHienTai = [];

    async function khoiTaoTrang() {
      const layoutData = await khoiTaoLayout({
        pageTitle: "Danh Mục Dữ Liệu",
        breadcrumb: "Quản trị & Sổ sách",
        activeMenuId: "danhmuc"
      });
      if (!layoutData) return;

      if (layoutData.vaiTro !== 'admin' && layoutData.vaiTro !== 'quanly') {
        alert("Bạn không có quyền truy cập trang này!");
        window.location.href = 'trang_chu.html';
        return;
      }
      taiDuLieu();
    }

    function doiBang() {
      trangHienTai = 1;
      taiDuLieu();
    }

    function doiKichThuocTrang() {
      trangHienTai = 1;
      taiDuLieu();
    }

    function chuyenTrang(huong) {
      let trangMoi = trangHienTai + huong;
      if (trangMoi >= 1 && trangMoi <= tongSoTrang) {
        trangHienTai = trangMoi;
        taiDuLieu();
      }
    }

    function xacDinhKhoaChinh(tenBang) {
      if (tenBang === 'khach_hang') return 'ma_kh';
      if (tenBang === 'hang_hoa' || tenBang === 'dinh_khoan_hang_hoa') return 'ma_hang';
      if (tenBang === 'danh_sach_xe') return 'ma_xe';
      if (tenBang === 'doi_ma_km') return 'ma_km';
      if (tenBang === 'tai_khoan_ngan_hang') return 'ten_tk';
      return 'id';
    }

    // Helper lưu trữ bền vững LocalStorage khi Supabase chưa tạo bảng
    function layDuLieuLocal(tenBang) {
      const localKey = `tmh_danh_muc_${tenBang}`;
      let localData = [];
      try {
        localData = JSON.parse(localStorage.getItem(localKey) || "[]");
      } catch (e) { localData = []; }

      // Khởi tạo danh sách tài khoản ngân hàng mặc định nếu chưa có
      if (tenBang === 'tai_khoan_ngan_hang' && (!localData || localData.length === 0)) {
        localData = [
          { ten_tk: "Tiền mặt lái xe", so_tk: "TIEN_MAT", ten_ngan_hang: "Tiền mặt", tk_misa: "1111" },
          { ten_tk: "VCB - 0041000266096", so_tk: "0041000266096", ten_ngan_hang: "Vietcombank (Thái Mỹ Hương)", tk_misa: "11211" },
          { ten_tk: "VCB - 0041000123456", so_tk: "0041000123456", ten_ngan_hang: "Vietcombank (Cá nhân Đạt)", tk_misa: "11212" },
          { ten_tk: "MBBank - 0905801918", so_tk: "0905801918", ten_ngan_hang: "MBBank (Cá nhân)", tk_misa: "11213" }
        ];
        localStorage.setItem(localKey, JSON.stringify(localData));
      }

      if (tenBang === 'danh_sach_xe' && (!localData || localData.length === 0)) {
        localData = [
          { ma_xe: "HD1 SÁNG", bien_so: "43C-12345", loai_xe: "Xe tải 1.4 tấn", tai_xe_mac_dinh: "SINH" },
          { ma_xe: "HD1 CHIỀU", bien_so: "43C-12345", loai_xe: "Xe tải 1.4 tấn", tai_xe_mac_dinh: "SINH" },
          { ma_xe: "HD2 SÁNG", bien_so: "43C-67890", loai_xe: "Xe tải 2.5 tấn", tai_xe_mac_dinh: "HẢI" },
          { ma_xe: "HD2 CHIỀU", bien_so: "43C-67890", loai_xe: "Xe tải 2.5 tấn", tai_xe_mac_dinh: "HẢI" }
        ];
        localStorage.setItem(localKey, JSON.stringify(localData));
      }

      return localData;
    }

    function luuDuLieuLocal(tenBang, item) {
      const localKey = `tmh_danh_muc_${tenBang}`;
      let list = layDuLieuLocal(tenBang);
      const khoaChinh = xacDinhKhoaChinh(tenBang);
      const valKhoa = String(item[khoaChinh] || '').trim();

      const idx = list.findIndex(x => String(x[khoaChinh] || '').trim().toLowerCase() === valKhoa.toLowerCase());
      if (idx !== -1) {
        list[idx] = { ...list[idx], ...item };
      } else {
        list.push(item);
      }
      localStorage.setItem(localKey, JSON.stringify(list));
      return list;
    }

    function xoaDuLieuLocal(tenBang, valKhoa) {
      const localKey = `tmh_danh_muc_${tenBang}`;
      let list = layDuLieuLocal(tenBang);
      const khoaChinh = xacDinhKhoaChinh(tenBang);
      list = list.filter(x => String(x[khoaChinh] || '').trim().toLowerCase() !== String(valKhoa).trim().toLowerCase());
      localStorage.setItem(localKey, JSON.stringify(list));
      return list;
    }

    async function taiDuLieu() {
      document.getElementById('formThemMoi').style.display = 'none';

      const tenBang = document.getElementById('chonBang').value;
      const soDong = parseInt(document.getElementById('soDongHienThi').value, 10);
      const thead = document.getElementById('bangHead');
      const tbody = document.getElementById('bangBody');
      
      tbody.innerHTML = `<tr><td colspan="10" class="text-center" style="padding:20px;">Đang tải trang ${trangHienTai}...</td></tr>`;
      
      const tuDong = (trangHienTai - 1) * soDong;
      const denDong = tuDong + soDong - 1;

      let duLieuHienThi = [];
      let tongSoDong = 0;
      let dungLocal = false;

      try {
        const res = await sb.from(tenBang).select('*', { count: 'exact' }).range(tuDong, denDong);
        if (res.error) {
          dungLocal = true;
        } else {
          duLieuHienThi = res.data || [];
          tongSoDong = res.count || 0;
          if (duLieuHienThi.length === 0) {
            const localCheck = layDuLieuLocal(tenBang);
            if (localCheck && localCheck.length > 0) {
              dungLocal = true;
            }
          }
        }
      } catch (err) {
        dungLocal = true;
      }

      if (dungLocal) {
        const localList = layDuLieuLocal(tenBang);
        tongSoDong = localList.length;
        duLieuHienThi = localList.slice(tuDong, denDong + 1);
      }

      duLieuBangHienTai = duLieuHienThi;
      tongSoTrang = Math.ceil(tongSoDong / soDong) || 1;
      document.getElementById('thongTinTrang').textContent = `Trang ${trangHienTai} / ${tongSoTrang} (Tổng: ${tongSoDong} dòng)`;

      if (duLieuBangHienTai.length === 0) {
        thead.innerHTML = '<tr><th>Thông báo</th></tr>';
        tbody.innerHTML = '<tr><td class="text-center" style="padding:20px; color:var(--text-muted);">Bảng này hiện chưa có dữ liệu. Bạn có thể bấm [Thêm Mới] hoặc [Upload từ Excel].</td></tr>';
        return;
      }

      const cacCot = Object.keys(duLieuBangHienTai[0]);
      const khoaChinh = xacDinhKhoaChinh(tenBang);

      let htmlHead = '<tr>';
      cacCot.forEach(cot => htmlHead += `<th>${cot.toUpperCase()}</th>`);
      htmlHead += '<th class="text-center">THAO TÁC</th></tr>';
      thead.innerHTML = htmlHead;

      let htmlBody = '';
      duLieuBangHienTai.forEach(dong => {
        htmlBody += '<tr>';
        cacCot.forEach(cot => {
          htmlBody += `<td>${dong[cot] !== null && dong[cot] !== undefined ? dong[cot] : ''}</td>`;
        });
        
        const giaTriKhoa = dong[khoaChinh];
        htmlBody += `<td class="text-center" style="white-space: nowrap;">
          <button type="button" class="btn btn-outline btn-sm" onclick="suaDong('${giaTriKhoa}')">Sửa</button>
          <button type="button" class="btn btn-outline btn-sm" style="color:#dc2626;" onclick="xoaDong('${giaTriKhoa}')">Xóa</button>
        </td>`;
        htmlBody += '</tr>';
      });
      tbody.innerHTML = htmlBody;
    }

    function moFormThem(cheDoEdit = false) {
      const form = document.getElementById('formThemMoi');
      const tenBang = document.getElementById('chonBang').value;
      const tenBangHienThi = document.getElementById('chonBang').options[document.getElementById('chonBang').selectedIndex].text;
      
      let html = `<h3 style="margin-top:0; font-size:15px; font-weight:800;">${cheDoEdit ? 'Sửa' : 'Thêm mới'} — ${tenBangHienThi}</h3>`;

      if (tenBang === 'khach_hang') {
        html += taoInput('ma_kh', 'Mã Khách Hàng (*)') + taoInput('ten_kh', 'Tên Khách Hàng') + taoInput('dia_chi', 'Địa Chỉ') + taoInput('dien_thoai', 'Điện Thoại') + taoInput('khu_vuc', 'Khu Vực');
      } else if (tenBang === 'hang_hoa') {
        html += taoInput('ma_hang', 'Mã Hàng (*)') + taoInput('ten_hang', 'Tên Hàng Hóa') + taoInput('dvt', 'Đơn Vị Tính') + taoInput('quy_cach', 'Quy Cách (Số lượng/thùng)', 'number') + taoInput('gia_ban', 'Giá Bán', 'number');
      } else if (tenBang === 'dinh_khoan_hang_hoa') {
        html += taoInput('ma_hang', 'Mã Hàng (*)') + taoInput('thue_suat', 'Thuế Suất GTGT (%)', 'number') + taoInput('tk_doanh_thu', 'TK Doanh Thu (5111x)') + taoInput('tk_gia_von', 'TK Giá Vốn (632x)') + taoInput('ma_kho', 'Mã Kho (KHO01)') + taoInput('tk_kho', 'TK Kho (1561)');
      } else if (tenBang === 'tai_khoan_ngan_hang') {
        html += taoInput('ten_tk', 'Tên Hiển Thị (*)') + taoInput('so_tk', 'Số Tài Khoản') + taoInput('ten_ngan_hang', 'Tên Ngân Hàng') + taoInput('tk_misa', 'TK MISA (11211, 11212...)');
      } else if (tenBang === 'danh_sach_xe') {
        html += taoInput('ma_xe', 'Mã Xe (*)') + taoInput('bien_so', 'Biển Số') + taoInput('loai_xe', 'Loại Xe') + taoInput('tai_xe_mac_dinh', 'Tài Xế Mặc Định');
      } else if (tenBang === 'doi_ma_km') {
        html += taoInput('ma_km', 'Mã Khuyến Mãi (*)') + taoInput('ma_that', 'Mã Hàng Thật (*)') + taoInput('ten_that', 'Tên Hàng Thật') + taoInput('quy_cach', 'Quy Cách', 'number');
      }

      html += `<div style="margin-top:14px; display:flex; gap:8px;">
        <button type="button" class="btn btn-primary" onclick="luuDuLieu('${tenBang}', ${cheDoEdit})">💾 Lưu lại</button>
        <button type="button" class="btn btn-outline" onclick="document.getElementById('formThemMoi').style.display='none'">Hủy</button>
      </div>`;

      form.innerHTML = html;
      form.style.display = 'block';
    }

    function taoInput(id, nhan, kieu = 'text') {
      return `<div class="form-group">
        <label>${nhan}:</label>
        <input type="${kieu}" id="inp_${id}" class="form-control">
      </div>`;
    }

    async function suaDong(khoa) {
      const tenBang = document.getElementById('chonBang').value;
      const khoaChinh = xacDinhKhoaChinh(tenBang);
      const dongCanSua = duLieuBangHienTai.find(d => String(d[khoaChinh]) === String(khoa));
      
      if (!dongCanSua) return;
      moFormThem(true);

      for (const key in dongCanSua) {
        const el = document.getElementById(`inp_${key}`);
        if (el) {
          el.value = dongCanSua[key] !== null ? dongCanSua[key] : '';
          if (key === khoaChinh) el.readOnly = true;
        }
      }
    }

    async function luuDuLieu(tenBang, cheDoEdit) {
      const inputs = document.querySelectorAll('#formThemMoi input');
      const duLieu = {};
      inputs.forEach(inp => {
        const cot = inp.id.replace('inp_', '');
        let val = inp.value.trim();
        if (inp.type === 'number') {
          val = val === '' ? null : Number(val);
        }
        duLieu[cot] = val;
      });

      const khoaChinh = xacDinhKhoaChinh(tenBang);
      if (!duLieu[khoaChinh]) {
        alert("Vui lòng nhập trường thông tin bắt buộc (*)");
        return;
      }

      // 1. Thử lưu Supabase (nếu bảng tồn tại trên cloud)
      try {
        await sb.from(tenBang).upsert(duLieu);
      } catch (err) {
        console.warn("Supabase upsert warning:", err);
      }

      // 2. Luôn đồng bộ vào bộ nhớ LocalStorage để dữ liệu luôn hoạt động trơn tru
      luuDuLieuLocal(tenBang, duLieu);

      alert("✅ Đã lưu dữ liệu thành công!");
      document.getElementById('formThemMoi').style.display = 'none';
      taiDuLieu();
    }

    async function xoaDong(khoa) {
      if (!confirm(`Bạn có chắc chắn muốn xóa dòng có mã "${khoa}" không?`)) return;
      const tenBang = document.getElementById('chonBang').value;
      const khoaChinh = xacDinhKhoaChinh(tenBang);

      // Thử xóa Supabase
      try {
        await sb.from(tenBang).delete().eq(khoaChinh, khoa);
      } catch (err) {
        console.warn(err);
      }

      // Xóa LocalStorage
      xoaDuLieuLocal(tenBang, khoa);

      alert("🗑️ Đã xóa thành công!");
      taiDuLieu();
    }

    function taiTemplate() {
      const tenBang = document.getElementById('chonBang').value;
      let headers = [];
      if (tenBang === 'khach_hang') headers = ["ma_kh", "ten_kh", "dia_chi", "dien_thoai", "khu_vuc"];
      else if (tenBang === 'hang_hoa') headers = ["ma_hang", "ten_hang", "dvt", "quy_cach", "gia_ban"];
      else if (tenBang === 'dinh_khoan_hang_hoa') headers = ["ma_hang", "thue_suat", "tk_doanh_thu", "tk_gia_von", "ma_kho", "tk_kho"];
      else if (tenBang === 'tai_khoan_ngan_hang') headers = ["ten_tk", "so_tk", "ten_ngan_hang", "tk_misa"];
      else if (tenBang === 'danh_sach_xe') headers = ["ma_xe", "bien_so", "loai_xe", "tai_xe_mac_dinh"];
      else if (tenBang === 'doi_ma_km') headers = ["ma_km", "ma_that", "ten_that", "quy_cach"];

      const ws = XLSX.utils.aoa_to_sheet([headers]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Template");
      XLSX.writeFile(wb, `Mau_Nhap_${tenBang}.xlsx`);
    }

    function docFileExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet);

          if (!json || json.length === 0) {
            alert("File không có dữ liệu!");
            return;
          }

          const tenBang = document.getElementById('chonBang').value;

          // Thử lưu vào Supabase
          try {
            await sb.from(tenBang).upsert(json);
          } catch (err) {
            console.warn(err);
          }

          // Lưu vào LocalStorage
          json.forEach(item => luuDuLieuLocal(tenBang, item));

          alert(`✅ Đã nạp thành công ${json.length} dòng vào bảng "${tenBang}"!`);
          taiDuLieu();
        } catch (err) {
          alert("Lỗi xử lý file Excel: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = "";
    }

    khoiTaoTrang();
  </script>
</body>
</html>
