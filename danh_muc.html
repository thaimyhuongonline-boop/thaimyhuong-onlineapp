    .dm-header-banner {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .dm-banner-info h1 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dm-banner-info p {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 680px;
      line-height: 1.45;
    }
    .badge-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .badge-green { background: #dcfce7; color: #15803d; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-amber { background: #fef3c7; color: #b45309; }
    .badge-purple { background: #f3e8ff; color: #6b21a8; }
    .badge-gray { background: #f1f5f9; color: #475569; }

<body>

  <main id="mainContent" style="display:none;">
    
    <!-- Banner Giới Thiệu -->

      </div>
      <div style="display: flex; gap: 10px;">
        <button type="button" class="btn btn-outline" onclick="taiDuLieuHienTai(true)">
          <span>🔄</span> Làm mới dữ liệu
        </button>
      </div>
    </div>

    <!-- 8 Tabs Danh Mục Chính -->
    <div class="dm-tabs-container" id="dmTabsContainer">
      <button type="button" class="dm-tab-btn active" onclick="chuyenTabDanhMuc('hang_hoa')" id="tabBtn_hang_hoa">
        <span>📦</span> Hàng hoá <span class="dm-tab-badge" id="badge_hang_hoa">0</span>
      </button>

        <span>👥</span> Khách hàng <span class="dm-tab-badge" id="badge_khach_hang">0</span>
      </button>
      <button type="button" class="dm-tab-btn" onclick="chuyenTabDanhMuc('danh_sach_xe')" id="tabBtn_danh_sach_xe">
        <span>🚚</span> Xe <span class="dm-tab-badge" id="badge_danh_sach_xe">0</span>
      </button>
      <button type="button" class="dm-tab-btn" onclick="chuyenTabDanhMuc('tai_khoan_ngan_hang')" id="tabBtn_tai_khoan_ngan_hang">

      </button>
      <button type="button" class="dm-tab-btn" onclick="chuyenTabDanhMuc('dinh_khoan_hang_hoa')" id="tabBtn_dinh_khoan_hang_hoa">
        <span>📑</span> Định khoản hàng hoá <span class="dm-tab-badge" id="badge_dinh_khoan_hang_hoa">0</span>
      </button>
      <button type="button" class="dm-tab-btn" onclick="chuyenTabDanhMuc('nv_kinh_doanh')" id="tabBtn_nv_kinh_doanh">
        <span>💼</span> Nhân viên kinh doanh <span class="dm-tab-badge" id="badge_nv_kinh_doanh">0</span>
      </button>

      </button>

        <span>🎁</span> Đổi mã khuyến mãi <span class="dm-tab-badge" id="badge_doi_ma_km">0</span>
      </button>
    </div>

    <!-- Toolbar: Tìm kiếm & Thao tác -->
    <div class="dm-toolbar">
      <div class="dm-search-wrap">
        <input type="text" id="inpTimKiem" class="form-control" placeholder="🔍 Tìm kiếm trong danh mục..." oninput="locDuLieu()">
      </div>
      <div class="dm-actions-wrap">
        <button type="button" class="btn btn-primary" onclick="moModalThem()">
          <span>➕</span> Thêm mới
        </button>
        <button type="button" class="btn btn-outline" onclick="taiFileMauExcel()">
          <span>📥</span> Tải file mẫu Excel
        </button>
        <label class="btn btn-outline" style="cursor: pointer; margin-bottom: 0;">
          <span>📤</span> Nhập từ Excel
          <input type="file" id="inpFileExcel" accept=".xlsx, .xls" style="display: none;" onchange="docFileExcel(event)">
        </label>
        <button type="button" class="btn btn-outline" onclick="xuatFileExcel()">
          <span>💾</span> Xuất Excel
        </button>
      </div>
    </div>

    <!-- Bảng Dữ Liệu -->
    <div class="dm-table-card">
      <div class="dm-table-responsive">
        <table class="dm-table">
          <thead id="dmTableHead">
            <!-- Render động các cột -->
          </thead>
          <tbody id="dmTableBody">
            <!-- Render động các dòng dữ liệu -->
          </tbody>
        </table>
      </div>
      <div id="dmEmptyState" style="display:none; text-align:center; padding: 48px 20px; color: var(--text-muted);">
        <div style="font-size: 38px; margin-bottom: 8px;">📭</div>
        <div style="font-size: 15px; font-weight: 700; color: var(--text-main);">Không tìm thấy dữ liệu</div>
        <p style="font-size: 13px; margin-top: 4px;">Chưa có bản ghi nào hoặc không khớp với từ khóa tìm kiếm.</p>
      </div>
    </div>

  </main>

  <!-- Modal Thêm / Sửa Bản Ghi Danh Mục -->

        </div>

    </div>

    // Hàm lưu Supabase thông minh: tự động phát hiện và loại bỏ các cột schema Supabase chưa có (ví dụ PGRST204)
    async function upsertSupabaseTuTu(tableName, payload) {
      if (typeof sb === 'undefined') return { success: false, error: 'No sb client' };

      let currentPayload = Array.isArray(payload)
        ? payload.map(item => ({ ...item }))
        : { ...payload };

      for (let attempt = 0; attempt < 10; attempt++) {
        try {
          const { data, error } = await sb.from(tableName).upsert(currentPayload);
          if (!error) {
            return { success: true, data };
          }
          console.warn(`[Supabase upsert ${tableName}] Lần ${attempt + 1}:`, error);

          // Phát hiện cột chưa tồn tại trong schema Supabase
          if (error.message && error.message.includes("Could not find the") && error.message.includes("column")) {
            const match = error.message.match(/Could not find the '([^']+)' column/i);
            if (match && match[1]) {
              const colLoi = match[1];
              console.log(`[Supabase auto-heal] Bỏ qua cột '${colLoi}' chưa có trong bảng ${tableName} để lưu tiếp...`);
              if (Array.isArray(currentPayload)) {
                currentPayload.forEach(row => delete row[colLoi]);
              } else {
                delete currentPayload[colLoi];
              }
              continue;
            }
          }
          return { success: false, error };
        } catch (ex) {
          console.warn(`[Supabase upsert exception ${tableName}]:`, ex);
          return { success: false, error: ex };
        }
      }
      return { success: false, error: 'Vượt quá số lần thử auto-heal' };
    }

    // Lấy dữ liệu từ Supabase hoặc fallback LocalStorage với cơ chế Merge hợp nhất
    async function layDuLieuBang(tenBang) {
      const cfg = CAU_HINH_DANH_MUC[tenBang];
      const khoa = cfg.khoaChinh;

      // 1. Đọc dữ liệu từ LocalStorage trước
      let dsLocal = [];
      try {
        const raw = localStorage.getItem(cfg.localKey);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) dsLocal = parsed;
        }
      } catch (e) {}

      // Nếu LocalStorage rỗng thì lấy từ seed mẫu
      if (dsLocal.length === 0 && cfg.seed && cfg.seed.length > 0) {
        dsLocal = [...cfg.seed];
      }

      const mapBanGhi = new Map();
      dsLocal.forEach(r => {
        if (r && r[khoa] !== undefined && r[khoa] !== null) {
          mapBanGhi.set(String(r[khoa]).trim().toUpperCase(), { ...r });
        }
      });

      // 2. Lấy dữ liệu từ Supabase và hợp nhất (Merge)
      try {
        if (typeof sb !== 'undefined') {
          const { data, error } = await sb.from(tenBang).select('*');
          if (!error && Array.isArray(data) && data.length > 0) {
            data.forEach(rSb => {
              if (!rSb || rSb[khoa] === undefined || rSb[khoa] === null) return;
              const k = String(rSb[khoa]).trim().toUpperCase();
              if (mapBanGhi.has(k)) {
                const itemCu = mapBanGhi.get(k);
                const itemHopNhat = { ...itemCu };
                for (const prop in rSb) {
                  if (rSb[prop] !== null && rSb[prop] !== undefined) {
                    itemHopNhat[prop] = rSb[prop];
                  }
                }
                mapBanGhi.set(k, itemHopNhat);
              } else {
                mapBanGhi.set(k, { ...rSb });
              }
            });
          }
        }
      } catch (e) {
        console.warn(`Chưa lấy được bảng ${tenBang} từ Supabase:`, e);
      }

      // 3. Tự động nâng cấp danh mục xe nếu là dữ liệu cũ
      if (tenBang === 'danh_sach_xe' && (mapBanGhi.size <= 4 || !Array.from(mapBanGhi.values()).some(x => String(x.ma_xe).startsWith('XE')))) {
        const dsXeMacDinh = typeof DANH_SACH_XE_MAC_DINH !== 'undefined' ? DANH_SACH_XE_MAC_DINH : cfg.seed;
        dsXeMacDinh.forEach(x => mapBanGhi.set(String(x.ma_xe).trim().toUpperCase(), { ...x }));
      }

      let ketQua = Array.from(mapBanGhi.values());

      // Sắp xếp ổn định theo mã khóa chính A -> Z
      ketQua.sort((a, b) => {
        const valA = String(a[khoa] || '');
        const valB = String(b[khoa] || '');
        return valA.localeCompare(valB, 'vi', { numeric: true });
      });

      // Lưu lại vào LocalStorage bản hợp nhất chuẩn nhất
      try {
        localStorage.setItem(cfg.localKey, JSON.stringify(ketQua));
      } catch (e) {}

      return ketQua;
    }

        } else if (col.type === "number") {
          const raw = el.value.trim();
          banGhiMoi[col.id] = raw === "" ? null : Number(raw);
        } else {
          banGhiMoi[col.id] = el.value.trim();
        }
      });

      // Theo dõi biến động giá khi sửa thủ công trong danh mục
      if (tabHienTai === "hang_hoa" && isEdit) {
        const dongCu = duLieuBangHienTai.find(r => String(r[cfg.khoaChinh]) === String(editKey));
        if (dongCu) {
          if (!Array.isArray(dongCu.lich_su_gia)) dongCu.lich_su_gia = [];
          if (banGhiMoi.gia_ban !== null && dongCu.gia_ban !== null && Math.round(banGhiMoi.gia_ban) !== Math.round(dongCu.gia_ban)) {
            const chenhLech = Number(banGhiMoi.gia_ban) - (Number(dongCu.gia_ban) || 0);
            dongCu.lich_su_gia.unshift({
              ngay: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' + new Date().toLocaleDateString('vi-VN'),
              gia_cu: Number(dongCu.gia_ban) || 0,
              gia_moi: Number(banGhiMoi.gia_ban),
              chenh_lech: chenhLech,
              ghi_chu: 'Cập nhật thủ công trong danh mục'
            });
          }
          banGhiMoi.lich_su_gia = dongCu.lich_su_gia;
        }
      }

      // Kiểm tra khóa chính
      if (!banGhiMoi[cfg.khoaChinh]) {
        alert(`Vui lòng nhập trường "${cfg.cot.find(c => c.id === cfg.khoaChinh).ten}"!`);
        return;
      }

      // 1. Lưu vào Supabase bằng hàm tự loại trừ cột schema thiếu
      await upsertSupabaseTuTu(tabHienTai, banGhiMoi);

      // 2. Lưu vào LocalStorage
      let dsLocal = [];
      try {
        dsLocal = JSON.parse(localStorage.getItem(cfg.localKey) || "[]");
      } catch (e) {}

      const kMoi = String(banGhiMoi[cfg.khoaChinh]).trim().toUpperCase();
      const idx = dsLocal.findIndex(r => String(r[cfg.khoaChinh]).trim().toUpperCase() === kMoi);
      if (idx >= 0) {
        dsLocal[idx] = { ...dsLocal[idx], ...banGhiMoi };
      } else {
        dsLocal.push(banGhiMoi);
      }
      localStorage.setItem(cfg.localKey, JSON.stringify(dsLocal));

      dongModalThemSua();
      await taiDuLieuHienTai();
      await capNhatTatCaBadges();

      alert(`✅ Đã lưu bản ghi "${banGhiMoi[cfg.khoaChinh]}" thành công!`);
    }

    // Xóa bản ghi
    async function xoaBanGhi(keyEncoded) {
      const key = decodeURIComponent(keyEncoded);
      const cfg = CAU_HINH_DANH_MUC[tabHienTai];

      if (!confirm(`Bạn có chắc chắn muốn xóa bản ghi "${key}" khỏi danh mục "${cfg.ten}" không?`)) {
        return;
      }

      // 1. Xóa Supabase
      try {
        if (typeof sb !== 'undefined') {
          await sb.from(tabHienTai).delete().eq(cfg.khoaChinh, key);
        }
      } catch (e) {
        console.warn("Lỗi xóa Supabase:", e);
      }

      // 2. Xóa LocalStorage
      let dsLocal = [];
      try {
        dsLocal = JSON.parse(localStorage.getItem(cfg.localKey) || "[]");
      } catch (e) {}

      dsLocal = dsLocal.filter(r => String(r[cfg.khoaChinh]) !== String(key));
      localStorage.setItem(cfg.localKey, JSON.stringify(dsLocal));

      await taiDuLieuHienTai();
      await capNhatTatCaBadges();

      alert(`🗑️ Đã xóa bản ghi "${key}" thành công!`);
    }

    // Tải file mẫu Excel chuẩn cho từng bảng
    function taiFileMauExcel() {
      const cfg = CAU_HINH_DANH_MUC[tabHienTai];
      const headers = cfg.cot.map(c => c.id);
      const headersDisplay = cfg.cot.map(c => c.ten);

      // Dữ liệu mẫu
      const sampleRow = cfg.cot.map(c => {
        if (c.type === 'number') return c.macDinh !== undefined ? c.macDinh : 0;
        if (c.type === 'boolean') return "TRUE";
        return c.macDinh || "";
      });

      const wsData = [headersDisplay, headers, sampleRow];
      const ws = XLSX.utils.aoa_to_sheet(wsData);

      // Định dạng header
      ws['!cols'] = cfg.cot.map(() => ({ wch: 22 }));

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Template");
      XLSX.writeFile(wb, `Mau_Nhap_${tabHienTai}.xlsx`);
    }

    // Đọc file Excel người dùng upload
    function docFileExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const cfg = CAU_HINH_DANH_MUC[tabHienTai];
      const reader = new FileReader();

      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

          if (!rows || rows.length < 2) {
            alert("File Excel không có dữ liệu hoặc định dạng không đúng!");
            return;
          }

          // Dòng 1 hoặc 2 là tên trường ID
          let headerRowIdx = 0;
          let headerCols = rows[0].map(c => String(c).trim());

          // Kiểm tra xem dòng 1 hay dòng 2 chứa mã trường kỹ thuật (ma_hang, ma_kh, etc.)
          const hasTechnicalId = cfg.cot.some(c => headerCols.includes(c.id));
          if (!hasTechnicalId && rows.length >= 2) {
            const row2Cols = rows[1].map(c => String(c).trim());
            if (cfg.cot.some(c => row2Cols.includes(c.id))) {
              headerRowIdx = 1;
              headerCols = row2Cols;
            }
          }

          const mapField = new Map();
          headerCols.forEach((h, colIdx) => {
            const hClean = h.toLowerCase().trim().replace(/[\r\n\t_]+/g, ' ');
            const hNoAccent = hClean.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');

            for (const col of cfg.cot) {
              const colIdClean = col.id.toLowerCase().replace(/[_]+/g, ' ');
              const colTenClean = col.ten.toLowerCase().trim();
              const colTenNoAccent = colTenClean.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');

              // Khớp ID kỹ thuật hoặc Tên hiển thị
              if (hClean === col.id.toLowerCase() || hClean === colIdClean || hClean === colTenClean || hNoAccent === colTenNoAccent) {
                mapField.set(colIdx, col);
                break;
              }

              // Nhận diện Quy Cách đóng gói linh hoạt
              if (col.id === 'quy_cach' && (
                hClean.includes('quy cach') || hNoAccent.includes('quy cach') ||
                hClean === 'qc' || hNoAccent === 'qc' ||
                hClean.includes('so luong/thung') || hNoAccent.includes('so luong/thung') ||
                hClean.includes('sl/thung') || hNoAccent.includes('sl/thung') ||
                hClean.includes('thung')
              )) {
                mapField.set(colIdx, col);
                break;
              }

              // Nhận diện Mã Hàng linh hoạt
              if (col.id === 'ma_hang' && (hClean.includes('ma hang') || hNoAccent.includes('ma hang') || hClean.includes('ma sp') || hNoAccent.includes('ma sp'))) {
                mapField.set(colIdx, col);
                break;
              }

              // Nhận diện Tên Hàng linh hoạt
              if (col.id === 'ten_hang' && (hClean.includes('ten hang') || hNoAccent.includes('ten hang') || hClean.includes('ten sp') || hNoAccent.includes('ten sp'))) {
                mapField.set(colIdx, col);
                break;
              }

              // Nhận diện ĐVT
              if (col.id === 'dvt' && (hClean.includes('don vi tinh') || hNoAccent.includes('don vi tinh') || hClean === 'dvt' || hClean === 'đvt')) {
                mapField.set(colIdx, col);
                break;
              }

              // Nhận diện Giá Bán
              if (col.id === 'gia_ban' && (hClean.includes('gia ban') || hNoAccent.includes('gia ban') || hClean.includes('don gia') || hNoAccent.includes('don gia'))) {
                mapField.set(colIdx, col);
                break;
              }

              // Nhận diện Mã Khách Hàng
              if (col.id === 'ma_kh' && (hClean.includes('ma kh') || hNoAccent.includes('ma kh') || hClean.includes('ma doi tac') || hNoAccent.includes('ma doi tac'))) {
                mapField.set(colIdx, col);
                break;
              }

              // Nhận diện Tên Khách Hàng
              if (col.id === 'ten_kh' && (hClean.includes('ten kh') || hNoAccent.includes('ten kh') || hClean.includes('ten khach') || hNoAccent.includes('ten khach'))) {
                mapField.set(colIdx, col);
                break;
              }
            }
          });

          const danhSachMoi = [];
          for (let r = headerRowIdx + 1; r < rows.length; r++) {
            const rowData = rows[r];
            if (!rowData || rowData.length === 0) continue;

            const item = {};
            let coDuLieu = false;

            mapField.forEach((colCfg, colIdx) => {
              let cellVal = rowData[colIdx];
              if (cellVal !== undefined && cellVal !== null && String(cellVal).trim() !== "") {
                coDuLieu = true;
                if (colCfg.id === "quy_cach") {
                  const s = String(cellVal).trim();
                  const m = s.match(/(\d+(?:[.,]\d+)?)/);
                  cellVal = m ? parseFloat(m[1].replace(',', '.')) : 1;
                  if (isNaN(cellVal) || cellVal <= 0) cellVal = 1;
                } else if (colCfg.type === "number") {
                  const s = String(cellVal).trim().replace(/[^\d.-]/g, '');
                  cellVal = Number(s) || 0;
                } else if (colCfg.type === "boolean") {
                  cellVal = String(cellVal).toUpperCase() === "TRUE" || String(cellVal) === "1";
                } else {
                  cellVal = String(cellVal).trim();
                }
                item[colCfg.id] = cellVal;
              }
            });

            if (coDuLieu && item[cfg.khoaChinh]) {
              danhSachMoi.push(item);
            }
          }

          if (danhSachMoi.length === 0) {
            alert("Không tìm thấy dòng dữ liệu hợp lệ trong file!");
            return;
          }

          // 1. Lưu Supabase với cơ chế tự loại trừ cột schema thiếu
          await upsertSupabaseTuTu(tabHienTai, danhSachMoi);

          // 2. Lưu vào LocalStorage
          let dsLocal = [];
          try {
            dsLocal = JSON.parse(localStorage.getItem(cfg.localKey) || "[]");
          } catch (e) {}

          const mapLocal = new Map();
          dsLocal.forEach(r => {
            if (r && r[cfg.khoaChinh]) mapLocal.set(String(r[cfg.khoaChinh]).trim().toUpperCase(), r);
          });

          danhSachMoi.forEach(item => {
            const k = String(item[cfg.khoaChinh]).trim().toUpperCase();
            if (mapLocal.has(k)) {
              mapLocal.set(k, { ...mapLocal.get(k), ...item });
            } else {
              mapLocal.set(k, item);
            }
          });
          localStorage.setItem(cfg.localKey, JSON.stringify(Array.from(mapLocal.values())));

          alert(`✅ Đã nạp thành công ${danhSachMoi.length} dòng vào danh mục "${cfg.ten}"!`);
          await taiDuLieuHienTai();
          await capNhatTatCaBadges();

        } catch (err) {
          alert("Lỗi khi đọc file Excel: " + err.message);
        }
      };

      reader.readAsArrayBuffer(file);
      event.target.value = "";
    }

    // Xuất file Excel dữ liệu danh mục hiện tại
    function xuatFileExcel() {
      const cfg = CAU_HINH_DANH_MUC[tabHienTai];
      if (!duLieuBangHienTai || duLieuBangHienTai.length === 0) {
        alert("Danh mục hiện tại chưa có dữ liệu để xuất!");
        return;
      }

      const headersDisplay = cfg.cot.map(c => c.ten);
      const rowsData = [headersDisplay];

      duLieuBangHienTai.forEach(row => {
        const rowVals = cfg.cot.map(c => {
          let val = row[c.id];
          if (val === null || val === undefined) return "";
          return val;
        });
        rowsData.push(rowVals);
      });

      const ws = XLSX.utils.aoa_to_sheet(rowsData);
      ws['!cols'] = cfg.cot.map(() => ({ wch: 22 }));

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, cfg.ten.substring(0, 31));
      XLSX.writeFile(wb, `Danh_Muc_${tabHienTai}_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    khoiTaoTrang();
  </script>
