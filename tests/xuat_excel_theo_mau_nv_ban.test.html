<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiểm tra Xuất Excel Theo Mẫu Có Cột NV BÁN HÀNG</title>
<style>
  body { font: 13px/1.5 monospace; padding: 16px; background: #f8fafc; color: #0f172a; }
  .ok { color: #15803d; font-weight: 700; }
  .loi { color: #b91c1c; font-weight: 700; }
  pre { background: #fff; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; white-space: pre-wrap; }
</style>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>
<h2>Kiểm Tra Tính Năng Bổ Sung Cột NV BÁN HÀNG Khi Xuất Excel Theo Mẫu</h2>
<h3 id="tieuDe">Đang chạy kiểm thử…</h3>
<pre id="ketQua"></pre>

<script>
  const kq = [];
  let soDat = 0, soTong = 0;
  function kiemTra(ten, dieuKien, chiTiet) {
    soTong++;
    if (dieuKien) {
      soDat++;
      kq.push("✅ " + ten);
    } else {
      kq.push("❌ " + ten + "  → THẤT BẠI: " + JSON.stringify(chiTiet));
    }
  }

  function conLaiCuaDon(d) {
    return (d.conLai !== undefined) ? d.conLai : Math.max(0, (d.soTienNo || 0) - (d.daThu || 0));
  }

  function cotSangChu(col) {
    let s = '';
    while (col > 0) {
      const m = (col - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      col = Math.floor((col - 1) / 26);
    }
    return s;
  }

  async function chayKiemThu() {
    try {
      // ========================================================
      // 1. KIỂM TRA MÃ NGUỒN THEO_DOI_CONG_NO.HTML
      // ========================================================
      const xhr = new XMLHttpRequest();
      xhr.open("GET", "../theo_doi_cong_no.html", false);
      xhr.send();
      const codeHTML = xhr.responseText;

      kiemTra("1.1: Hàm xuatBaoCaoExcelTheoMau có định nghĩa tiêu đề cột 'NV BÁN HÀNG' ngay sau 'KHÁCH HÀNG'",
        codeHTML.includes("const tieuDeCot = ['STT', 'NGÀY', 'KHÁCH HÀNG', 'NV BÁN HÀNG']"));

      kiemTra("1.2: ws.columns có thiết lập width: 22 cho cột NV BÁN HÀNG",
        codeHTML.includes("ws.columns = [{ width: 5 }, { width: 11 }, { width: 34 }, { width: 22 }]"));

      kiemTra("1.3: Cột THÀNH TIỀN có chỉ số cotThanhTien = 5 + soCotHang",
        codeHTML.includes("const cotThanhTien = 5 + soCotHang"));

      kiemTra("1.4: views frozen pane cập nhật xSplit: 4 để cố định cả cột NV BÁN HÀNG",
        codeHTML.includes("views: [{ state: 'frozen', xSplit: 4, ySplit: 5 }]"));

      kiemTra("1.5: Dòng tổng cộng hợp nhất 4 cột (STT, NGÀY, KHÁCH HÀNG, NV BÁN HÀNG) bằng gop(dongSo, 1, 4)",
        codeHTML.includes("gop(dongSo, 1, 4)"));

      kiemTra("1.6: Có cơ chế mapNVTheoKhach để tra cứu fallback khi đơn nợ bị trống sales",
        codeHTML.includes("mapNVTheoKhach"));

      kiemTra("1.7: Xử lý an toàn chuỗi 'null' / 'undefined' thành ô trống ''",
        codeHTML.includes("if (nvBanHang === 'null' || nvBanHang === 'undefined') nvBanHang = '';"));

      kiemTra("1.8: Có thiết lập AutoFilter trải rộng toàn bộ bảng từ cột 1 đến soCot",
        codeHTML.includes("ws.autoFilter = `${cotSangChu(1)}5:${cotSangChu(soCot)}"));

      // ========================================================
      // 2. TEST CASE 1: TÍCH CHỌN NHIỀU KHÁCH HÀNG CÓ NV BÁN HÀNG
      // ========================================================
      const wb1 = new ExcelJS.Workbook();
      const ws1 = wb1.addWorksheet('Cong_No', {
        views: [{ state: 'frozen', xSplit: 4, ySplit: 5 }]
      });

      const dsDonCoSales = [
        { id: 1, maHD: 'HD287439.01', tenKH: 'COCO BEACH LÔ 10 VÕ NGUYỄN GIÁP', nguoiBan: 'Đặng Văn Tiến - 0905 714 901', tienHD: 26320000, soTienNo: 26320000, daThu: 0, trangThai: 'chua_thu' },
        { id: 2, maHD: 'HD287658.01', tenKH: 'GU QUÁN - 15-17 DOÃN KHUÊ', nguoiBan: 'Lê Đức Tính - 0787 952 774', tienHD: 25530000, soTienNo: 25530000, daThu: 0, trangThai: 'chua_thu' },
        { id: 3, maHD: 'HD287999.01', tenKH: 'NHÀ HÀNG HẢI SẢN BÉ MẶN', nguoiBan: 'Nguyễn Tấn Đạt', tienHD: 15400000, soTienNo: 15400000, daThu: 5400000, trangThai: 'da_thu_mot_phan' }
      ];

      const dsCot1 = []; // Không có cột sản phẩm riêng (như trường hợp xuất đơn thuần)
      const soCotHang1 = dsCot1.length;
      const cotThanhTien1 = 5 + soCotHang1;
      const cotSoHD1 = cotThanhTien1 + 1;
      const cotTrangThai1 = cotThanhTien1 + 2;
      const cotTongHD1 = cotThanhTien1 + 3;
      const soCot1 = cotTongHD1;

      const tieuDeCot1 = ['STT', 'NGÀY', 'KHÁCH HÀNG', 'NV BÁN HÀNG']
        .concat(dsCot1.map(c => c.tenHang))
        .concat(['THÀNH TIỀN', 'SỐ HĐ', 'TRẠNG THÁI THANH TOÁN', 'TỔNG TIỀN TRÊN HOÁ ĐƠN']);

      const hangTieuDe1 = ws1.getRow(5);
      tieuDeCot1.forEach((v, i) => {
        const c = hangTieuDe1.getCell(i + 1);
        c.value = v;
      });

      let dongSo1 = 6;
      dsDonCoSales.forEach((d, idx) => {
        const cl = conLaiCuaDon(d);
        const daThu = d.daThu || 0;
        const tt = (d.trangThai === 'da_thu_du' || cl <= 0) ? 'Đã thanh toán' : (daThu > 0 ? 'Thanh toán một phần' : 'Chưa thanh toán');
        const nvBanHang = String(d.nguoiBan || '').trim();

        const giaTri = [idx + 1, '24/10/2026', d.tenKH, nvBanHang]
          .concat([d.tienHD, d.maHD, tt, null]);

        const hang = ws1.getRow(dongSo1);
        giaTri.forEach((v, i) => {
          hang.getCell(i + 1).value = v;
        });
        dongSo1++;
      });

      const r6_1 = ws1.getRow(6);
      const r7_1 = ws1.getRow(7);
      const r8_1 = ws1.getRow(8);

      kiemTra("Test 1.1: Dòng 1 cột NV BÁN HÀNG khớp chính xác 'Đặng Văn Tiến - 0905 714 901'",
        r6_1.getCell(4).value === 'Đặng Văn Tiến - 0905 714 901');

      kiemTra("Test 1.2: Dòng 2 cột NV BÁN HÀNG khớp chính xác 'Lê Đức Tính - 0787 952 774'",
        r7_1.getCell(4).value === 'Lê Đức Tính - 0787 952 774');

      kiemTra("Test 1.3: Dòng 3 cột NV BÁN HÀNG khớp chính xác 'Nguyễn Tấn Đạt'",
        r8_1.getCell(4).value === 'Nguyễn Tấn Đạt');

      // ========================================================
      // 3. TEST CASE 2: KHÁCH HÀNG KHÔNG CÓ NV BÁN HÀNG (HOẶC KHÁCH LẺ)
      // ========================================================
      const wb2 = new ExcelJS.Workbook();
      const ws2 = wb2.addWorksheet('Cong_No');

      const dsDonKhongSales = [
        { id: 10, maHD: 'HD291169', tenKH: 'Khách lẻ', nguoiBan: null, tienHD: 398000, soTienNo: 398000, daThu: 0 },
        { id: 11, maHD: 'HD291170', tenKH: 'Khách vãng lai', nguoiBan: undefined, tienHD: 500000, soTienNo: 500000, daThu: 0 },
        { id: 12, maHD: 'HD291171', tenKH: 'Tạp hóa Bình Minh', nguoiBan: '', tienHD: 1200000, soTienNo: 1200000, daThu: 0 },
        { id: 13, maHD: 'HD291172', tenKH: 'Đại lý An Nhiên', nguoiBan: 'null', tienHD: 850000, soTienNo: 850000, daThu: 0 },
        { id: 14, maHD: 'HD291173', tenKH: 'Quán Cô Mai', nguoiBan: 'undefined', tienHD: 620000, soTienNo: 620000, daThu: 0 }
      ];

      const hangTieuDe2 = ws2.getRow(5);
      tieuDeCot1.forEach((v, i) => { hangTieuDe2.getCell(i + 1).value = v; });

      let dongSo2 = 6;
      dsDonKhongSales.forEach((d, idx) => {
        let nvBanHang = String(d.nguoiBan || '').trim();
        if (nvBanHang === 'null' || nvBanHang === 'undefined') nvBanHang = '';

        const giaTri = [idx + 1, '24/10/2026', d.tenKH, nvBanHang]
          .concat([d.tienHD, d.maHD, 'Chưa thanh toán', null]);

        const hang = ws2.getRow(dongSo2);
        giaTri.forEach((v, i) => { hang.getCell(i + 1).value = v; });
        dongSo2++;
      });

      kiemTra("Test 2.1: nguoiBan = null xuất ra chuỗi rỗng '' (không phải 'null')",
        ws2.getRow(6).getCell(4).value === '');

      kiemTra("Test 2.2: nguoiBan = undefined xuất ra chuỗi rỗng '' (không phải 'undefined')",
        ws2.getRow(7).getCell(4).value === '');

      kiemTra("Test 2.3: nguoiBan = '' xuất ra chuỗi rỗng ''",
        ws2.getRow(8).getCell(4).value === '');

      kiemTra("Test 2.4: nguoiBan là chuỗi 'null' được lọc sạch thành ''",
        ws2.getRow(9).getCell(4).value === '');

      kiemTra("Test 2.5: nguoiBan là chuỗi 'undefined' được lọc sạch thành ''",
        ws2.getRow(10).getCell(4).value === '');

      // ========================================================
      // 4. TEST CASE 3: THỨ TỰ DỮ LIỆU & ĐỊNH DẠNG CỘT (KHÔNG LỆCH CỘT)
      // ========================================================
      // Bảng không có mặt hàng (8 cột)
      kiemTra("Test 3.1: Thứ tự cột 1 là 'STT'", hangTieuDe1.getCell(1).value === 'STT');
      kiemTra("Test 3.2: Thứ tự cột 2 là 'NGÀY'", hangTieuDe1.getCell(2).value === 'NGÀY');
      kiemTra("Test 3.3: Thứ tự cột 3 là 'KHÁCH HÀNG'", hangTieuDe1.getCell(3).value === 'KHÁCH HÀNG');
      kiemTra("Test 3.4: Thứ tự cột 4 là 'NV BÁN HÀNG'", hangTieuDe1.getCell(4).value === 'NV BÁN HÀNG');
      kiemTra("Test 3.5: Thứ tự cột 5 là 'THÀNH TIỀN'", hangTieuDe1.getCell(5).value === 'THÀNH TIỀN');
      kiemTra("Test 3.6: Thứ tự cột 6 là 'SỐ HĐ'", hangTieuDe1.getCell(6).value === 'SỐ HĐ');
      kiemTra("Test 3.7: Thứ tự cột 7 là 'TRẠNG THÁI THANH TOÁN'", hangTieuDe1.getCell(7).value === 'TRẠNG THÁI THANH TOÁN');
      kiemTra("Test 3.8: Thứ tự cột 8 là 'TỔNG TIỀN TRÊN HOÁ ĐƠN'", hangTieuDe1.getCell(8).value === 'TỔNG TIỀN TRÊN HOÁ ĐƠN');

      // Kiểm tra giá trị các cột sau không bị lệch
      kiemTra("Test 3.9: Cột 5 (THÀNH TIỀN) chứa số tiền 26.320.000 (không bị nhầm sang chuỗi)",
        r6_1.getCell(5).value === 26320000);
      kiemTra("Test 3.10: Cột 6 (SỐ HĐ) chứa đúng mã 'HD287439.01'",
        r6_1.getCell(6).value === 'HD287439.01');
      kiemTra("Test 3.11: Cột 7 (TRẠNG THÁI THANH TOÁN) chứa đúng 'Chưa thanh toán'",
        r6_1.getCell(7).value === 'Chưa thanh toán');
      kiemTra("Test 3.12: Cột 8 (TỔNG TIỀN TRÊN HOÁ ĐƠN) để trống để kế toán điền (null)",
        r6_1.getCell(8).value === null);

      // ========================================================
      // 5. TEST CASE 4: KIỂM TRA TRƯỜNG HỢP CÓ CỘT MẶT HÀNG (DYNAMIC ITEMS)
      // ========================================================
      const wb3 = new ExcelJS.Workbook();
      const ws3 = wb3.addWorksheet('Cong_No');

      const dsCotMock = [
        { khoa: 'SP01', tenHang: 'Nước suối Aquafina 500ml', km: false },
        { khoa: 'SP02', tenHang: 'Khăn lạnh Thái Mỹ Hương', km: true }
      ];
      const soCotHang3 = dsCotMock.length; // 2 mặt hàng
      const cotThanhTien3 = 5 + soCotHang3; // Cột 7
      const cotSoHD3 = cotThanhTien3 + 1;   // Cột 8
      const cotTrangThai3 = cotThanhTien3 + 2; // Cột 9
      const cotTongHD3 = cotThanhTien3 + 3; // Cột 10

      const tieuDeCot3 = ['STT', 'NGÀY', 'KHÁCH HÀNG', 'NV BÁN HÀNG']
        .concat(dsCotMock.map(c => c.tenHang))
        .concat(['THÀNH TIỀN', 'SỐ HĐ', 'TRẠNG THÁI THANH TOÁN', 'TỔNG TIỀN TRÊN HOÁ ĐƠN']);

      const hangTieuDe3 = ws3.getRow(5);
      tieuDeCot3.forEach((v, i) => { hangTieuDe3.getCell(i + 1).value = v; });

      kiemTra("Test 4.1: Khi có 2 mặt hàng, cột 4 vẫn là 'NV BÁN HÀNG'",
        hangTieuDe3.getCell(4).value === 'NV BÁN HÀNG');
      kiemTra("Test 4.2: Mặt hàng 1 nằm ở cột 5",
        hangTieuDe3.getCell(5).value === 'Nước suối Aquafina 500ml');
      kiemTra("Test 4.3: Mặt hàng 2 nằm ở cột 6",
        hangTieuDe3.getCell(6).value === 'Khăn lạnh Thái Mỹ Hương');
      kiemTra("Test 4.4: Cột THÀNH TIỀN đẩy sang cột 7",
        hangTieuDe3.getCell(cotThanhTien3).value === 'THÀNH TIỀN');
      kiemTra("Test 4.5: Cột SỐ HĐ đẩy sang cột 8",
        hangTieuDe3.getCell(cotSoHD3).value === 'SỐ HĐ');
      kiemTra("Test 4.6: Cột TRẠNG THÁI THANH TOÁN đẩy sang cột 9",
        hangTieuDe3.getCell(cotTrangThai3).value === 'TRẠNG THÁI THANH TOÁN');
      kiemTra("Test 4.7: Cột TỔNG TIỀN TRÊN HOÁ ĐƠN nằm ở cột 10",
        hangTieuDe3.getCell(cotTongHD3).value === 'TỔNG TIỀN TRÊN HOÁ ĐƠN');

      // Kiểm tra chuyển đổi số cột sang chữ cái Excel
      kiemTra("Test 5.1: cotSangChu(1) = 'A'", cotSangChu(1) === 'A');
      kiemTra("Test 5.2: cotSangChu(4) = 'D' (Cột NV BÁN HÀNG)", cotSangChu(4) === 'D');
      kiemTra("Test 5.3: cotSangChu(8) = 'H'", cotSangChu(8) === 'H');
      kiemTra("Test 5.4: cotSangChu(10) = 'J'", cotSangChu(10) === 'J');

      // ========================================================
      // 6. KIỂM TRA TẠO FILE VÀ BUFFER THỰC TẾ
      // ========================================================
      const buffer = await wb1.xlsx.writeBuffer();
      kiemTra("Test 6.1: wb1.xlsx.writeBuffer() tạo thành công file binary không lỗi",
        buffer && buffer.byteLength > 1000);

      // Kết quả tổng kết
      const elTieuDe = document.getElementById('tieuDe');
      elTieuDe.textContent = (soDat === soTong ? `PASS ` : `FAIL `) + `${soDat}/${soTong} tests`;
      elTieuDe.className = soDat === soTong ? 'ok' : 'loi';
      document.getElementById('ketQua').textContent = kq.join('\n');
    } catch (err) {
      document.getElementById('tieuDe').textContent = 'ERROR';
      document.getElementById('tieuDe').className = 'loi';
      document.getElementById('ketQua').textContent = 'Lỗi thực thi test: ' + err.stack;
    }
  }

  chayKiemThu();
</script>
</body>
</html>
